<title>Corner · Flight Deck</title>
<style>
:root{--ground:#E9ECEE;--surface:#FDFDFC;--ink:#12171A;--muted:#6B767E;--rule:#D2D8DC;--accent:#A8641F;--error:#9B2C2C}
@media (prefers-color-scheme: dark){:root{--ground:#101417;--surface:#171C20;--ink:#E6EBEE;--muted:#9AA5AC;--rule:#2A3237;--accent:#D08A45;--error:#E08A8A}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--rule);padding:28px 24px;display:grid;gap:12px;border-radius:6px}
.k{font:500 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:600 22px/1.2 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0 0 6px}
label{font-size:13px;color:var(--muted)}
.rm{display:flex;gap:8px;align-items:center}
input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:4px}
button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.5em;margin:0;font-size:13px;color:var(--error)}
#wait{color:var(--muted);font:500 12px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
.hide{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

const G="fd-gate-v1";
const b=(s)=>Uint8Array.from(atob(s),(c)=>c.charCodeAt(0));
const u=(a)=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function open_(key){
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},key,b(P.c)));
}
function show(html){const go=()=>{document.open();document.write(html);document.close();};if(document.readyState==="complete")go();else window.addEventListener("load",()=>setTimeout(go,0),{once:true});}
function ask(){document.getElementById("wait").classList.add("hide");document.getElementById("f").classList.remove("hide");document.getElementById("pw").focus();}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(G)}catch(e){}
  if(saved){
    document.getElementById("wait").classList.remove("hide");
    try{const k=await crypto.subtle.importKey("raw",b(saved),{name:"AES-GCM"},false,["decrypt"]);show(await open_(k));return;}
    catch(e){try{localStorage.removeItem(G)}catch(_){}}
  }
  ask();
})();
document.getElementById("f").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const pw=document.getElementById("pw"),go=document.getElementById("go"),msg=document.getElementById("msg");
  go.disabled=true;msg.textContent="";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    const html=await open_(key);
    if(document.getElementById("rm").checked){try{localStorage.setItem(G,u(await crypto.subtle.exportKey("raw",key)))}catch(_){}}
    show(html);
  }catch(err){msg.textContent="Wrong password.";go.disabled=false;pw.select();}
});
</script>
